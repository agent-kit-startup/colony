# Release: a pushed tag v<version> builds Colony for Linux x86_64, assembles the
# release files (packaging/make-release.sh), signs SHA256SUMS with the Colony
# release key (Tauri signer, minisign format; public key in packaging/install.sh)
# and creates the GitHub release with them. Publishing the files to the public
# download base of install.sh is a separate, manual step (docs/release.md).
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Tag matches the app version
        id: version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          conf="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          pkg="$(node -p "require('./package.json').version")"
          cargo="$(sed -n 's/^version = "\(.*\)"$/\1/p' src-tauri/Cargo.toml | head -n1)"
          echo "tag=$tag tauri.conf.json=$conf package.json=$pkg Cargo.toml=$cargo"
          if [ "$tag" != "$conf" ] || [ "$tag" != "$pkg" ] || [ "$tag" != "$cargo" ]; then
            echo "::error::tag v$tag does not match the app version in all three files"
            exit 1
          fi
          echo "version=$tag" >> "$GITHUB_OUTPUT"

      - name: Signing key present
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::secret TAURI_SIGNING_PRIVATE_KEY is not set: no unsigned release"
            exit 1
          fi

      - name: System libraries (Tauri 2 on Ubuntu)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Rust stable
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v6.1.0

      - name: Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm tauri build

      - name: Test (after the build, the Tauri context needs dist/)
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Release files
        run: packaging/make-release.sh "${{ steps.version.outputs.version }}" release

      - name: Sign SHA256SUMS
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          pnpm tauri signer sign release/SHA256SUMS
          test -s release/SHA256SUMS.sig

      - name: Verify like install.sh does
        run: |
          base64 -d < release/SHA256SUMS.sig | sed -n 1,4p
          base="$(mktemp -d)"
          mkdir -p "$base/v${{ steps.version.outputs.version }}" "$RUNNER_TEMP/home"
          cp release/* "$base/v${{ steps.version.outputs.version }}/"
          echo "${{ steps.version.outputs.version }}" > "$base/LATEST"
          HOME="$RUNNER_TEMP/home" COLONY_DOWNLOAD_BASE="file://$base" sh packaging/install.sh

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/* \
            --title "Colony ${{ steps.version.outputs.version }}" \
            --notes "Linux x86_64. Verify: SHA256SUMS.sig is a minisign signature (base64) by key 9A9BB4349C2248C6; install with packaging/install.sh." \
            --prerelease
