# Release: a pushed tag v<version> builds Colony for Linux x86_64, assembles the
# release files (packaging/make-release.sh), signs SHA256SUMS with the Colony
# release key (Tauri signer, minisign format; public key in packaging/install.sh)
# and creates the GitHub release with them. The GitHub Releases of this public
# repository are the download base of install.sh: a plain v<x.y.z> tag becomes the
# Latest release (what install.sh installs by default); a tag with a pre-release
# suffix (v0.2.0-rc.1) stays a prerelease and is only installed with --version.
# Two channels from one tag (src-tauri/src/appupdate.rs): the direct build (default
# features: tauri-plugin-updater in; tarball, .deb, AppImage + updater signature and
# latest.json for in-app updates) and the package build (--no-default-features: no
# updater; the -package tarball distro packages are made from).
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Tag matches the app version
        id: version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          conf="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          pkg="$(node -p "require('./package.json').version")"
          cargo="$(sed -n 's/^version = "\(.*\)"$/\1/p' src-tauri/Cargo.toml | head -n1)"
          echo "tag=$tag tauri.conf.json=$conf package.json=$pkg Cargo.toml=$cargo"
          if [ "$tag" != "$conf" ] || [ "$tag" != "$pkg" ] || [ "$tag" != "$cargo" ]; then
            echo "::error::tag v$tag does not match the app version in all three files"
            exit 1
          fi
          echo "version=$tag" >> "$GITHUB_OUTPUT"

      - name: Signing key present
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::secret TAURI_SIGNING_PRIVATE_KEY is not set: no unsigned release"
            exit 1
          fi

      - name: System libraries (Tauri 2 on Ubuntu)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Rust stable
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v6.1.0

      - name: Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Direct channel. createUpdaterArtifacts signs the AppImage for the updater with the
      # release key (Colony_<v>_amd64.AppImage.sig); kept out of tauri.conf.json so local
      # builds need no signing key.
      - name: Build (direct channel)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          pnpm tauri build --bundles deb,appimage --config '{"bundle":{"createUpdaterArtifacts":true}}'
          v="${{ steps.version.outputs.version }}"
          test -s "src-tauri/target/release/bundle/appimage/Colony_${v}_amd64.AppImage.sig"
          mkdir -p "$RUNNER_TEMP/bin"
          cp src-tauri/target/release/colony "$RUNNER_TEMP/bin/colony-direct"

      # Package channel: same sources, updater compiled out. Overwrites target/release/colony,
      # so the direct binary was copied first.
      - name: Build (package channel)
        run: |
          pnpm tauri build --no-bundle -- --no-default-features
          cp src-tauri/target/release/colony "$RUNNER_TEMP/bin/colony-package"

      - name: Test (after the build, the Tauri context needs dist/)
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Release files
        env:
          COLONY_RELEASE_BIN: ${{ runner.temp }}/bin/colony-direct
          COLONY_PACKAGE_BIN: ${{ runner.temp }}/bin/colony-package
          COLONY_RELEASE_REPO: ${{ github.repository }}
        run: |
          packaging/make-release.sh "${{ steps.version.outputs.version }}" release
          test -s release/latest.json

      - name: Sign SHA256SUMS
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          pnpm tauri signer sign release/SHA256SUMS
          test -s release/SHA256SUMS.sig

      - name: Verify like install.sh does
        run: |
          base64 -d < release/SHA256SUMS.sig | sed -n 1,4p
          base="$(mktemp -d)"
          mkdir -p "$base/v${{ steps.version.outputs.version }}" "$RUNNER_TEMP/home"
          cp release/* "$base/v${{ steps.version.outputs.version }}/"
          echo "${{ steps.version.outputs.version }}" > "$base/LATEST"
          HOME="$RUNNER_TEMP/home" COLONY_DOWNLOAD_BASE="file://$base" sh packaging/install.sh

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${{ steps.version.outputs.version }}"
          case "$version" in
            *-*) kind=--prerelease ;;
            *) kind=--latest ;;
          esac
          gh release create "$GITHUB_REF_NAME" release/* \
            --title "Colony $version" \
            --notes "Linux x86_64. Install: curl -fsSL https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/install.sh | sh (or sh -s -- --version $version). SHA256SUMS.sig is a minisign signature (base64) by key 9A9BB4349C2248C6; install.sh checks it and the sha256 before installing." \
            "$kind"
