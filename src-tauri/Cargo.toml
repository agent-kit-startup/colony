[package]
name = "colony"
version = "0.1.0"
description = "Mission Kit Colony desktop IDE"
edition = "2021"
publish = false
license = "Apache-2.0"

[lib]
name = "colony_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.3", features = [] }

[dependencies]
tauri = { version = "=2.12.4", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2.7"
portable-pty = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
# engine.rs: already in the tree through tauri (no new crates).
semver = "1"
sha2 = "0.10"
# Engine signature over SHA256SUMS (engine.rs verify_sums_signature): minisign format,
# pure Rust, no dependencies; the same crate tauri-plugin-updater verifies with.
minisign-verify = "0.3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
